name: testes
on: [push, pull_request]
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install -e .
      - name: Trilha-copy, para conferir a cópia do padrão de texto
        run: |
          git clone --depth 1 https://github.com/davi-barbosap/Trilha-copy ../Trilha-copy
          pip install -e ../Trilha-copy
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/*.test.mjs
      - run: python -m trilha_lp validar exemplos/escola-exemplo/pagina.yaml
      - run: python -m trilha_lp construir exemplos/escola-exemplo/pagina.yaml --todas
      - run: python -m trilha_lp validar tests/fixtures/residencial-exemplo/pagina.yaml
      - name: O pacote instalado leva o padrão de texto
        run: |
          pip install --no-deps --target /tmp/instalado .
          cd /tmp && PYTHONPATH=/tmp/instalado python -c "import trilha_lp.padrao as p; assert '/tmp/instalado' in p.__file__, p.__file__; p.carregar()"
