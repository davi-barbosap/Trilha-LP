# Cópia dos vocabulários e parâmetros do padrão de texto da Trilha que a LP usa.
#
# O arquivo canônico é trilha_copy/regras/padrao.yaml, no Trilha-copy. NÃO edite aqui: mude lá e copie para cá.
# A CI confere lista a lista (tests/test_padrao.py) e quebra se esta cópia ficar diferente.
# Notação: termo inteiro; radical* (começo de palavra); re:expressão (regex com borda no começo).
# O texto completo da página também passa pelo padrão inteiro no Trilha-copy: python -m trilha_copy revisar-pagina.

